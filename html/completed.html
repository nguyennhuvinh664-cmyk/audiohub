<body class="listing-page">
<div id="page-content">
  <div class="m-page">
  <main><section class="stories-hero"><div class="container"><h1 class="stories-hero__title">Truyện Đã Hoàn Thành</h1></div></section><section class="stories-section"><div class="container">
    <div class="story-filter-panel">
      <form class="story-filter-form" data-completed-filter-form>
        <div class="story-filter-field"><label for="completed-filter-title">Tên truyện</label><input id="completed-filter-title" class="story-filter-input" type="search" placeholder="Tìm theo tên truyện" data-completed-filter-title /></div>
        <div class="story-filter-field"><label for="completed-filter-author">Tác giả</label><input id="completed-filter-author" class="story-filter-input" type="search" placeholder="Tìm theo tác giả" data-completed-filter-author /></div>
        <div class="story-filter-field"><label for="completed-filter-genre">Thể loại</label><select id="completed-filter-genre" class="story-filter-select" data-completed-filter-genre><option value="">Tất cả thể loại</option><option value="Cổ Đại">Cổ Đại</option><option value="Cổ Tích">Cổ Tích</option><option value="Đam Mỹ">Đam Mỹ</option><option value="Dị Năng">Dị Năng</option><option value="Fanfic">Fanfic</option><option value="Hệ Thống">Hệ Thống</option><option value="Hiện Đại">Hiện Đại</option><option value="Hoàng Đế">Hoàng Đế</option><option value="Huyền Huyễn">Huyền Huyễn</option><option value="Không Gian">Không Gian</option><option value="Kiếm Hiệp">Kiếm Hiệp</option><option value="Linh Dị">Linh Dị</option><option value="Mạt Thế">Mạt Thế</option><option value="Ngôn Tình">Ngôn Tình</option><option value="Ngọt Sủng">Ngọt Sủng</option><option value="Nữ Cường">Nữ Cường</option><option value="Quân Nhân">Quân Nhân</option><option value="Sát Thủ">Sát Thủ</option><option value="Sủng Thú">Sủng Thú</option><option value="Tận Thế">Tận Thế</option><option value="Thập Niên">Thập Niên</option><option value="Thú Nhân">Thú Nhân</option><option value="Tinh Tế">Tinh Tế</option><option value="Trọng Sinh">Trọng Sinh</option></select></div>
        <div class="story-filter-actions"><button type="submit" class="btn btn--primary story-filter-btn">Áp Dụng</button><button type="button" class="btn btn--outline story-filter-reset" data-completed-filter-reset>Xóa Lọc</button></div>
      </form>
      <div class="story-filter-summary" data-completed-filter-summary>Hiển thị tất cả truyện trong danh sách.</div>
      <div class="story-empty" data-completed-filter-empty>Không tìm thấy truyện phù hợp với bộ lọc hiện tại.</div>
    </div>
    <div class="stories-grid" data-story-filter-root></div>
    <nav class="pagination" aria-label="Phân trang truyện hoàn thành"></nav>
  </div></section></main>
