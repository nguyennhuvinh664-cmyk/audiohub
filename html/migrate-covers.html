<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Migrate Covers to Storage</title>
  <style>
    body { font-family: monospace; background: #111; color: #0f0; padding: 20px; }
    #log { white-space: pre-wrap; line-height: 1.6; }
    button { background: #f59e0b; color: #000; border: none; padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 10px 0; border-radius: 6px; }
    button:hover { background: #d97706; }
    .ok { color: #0f0; }
    .err { color: #f00; }
    .info { color: #0af; }
  </style>
</head>
<body>
  <h2>🔄 Migrate Covers to Supabase Storage</h2>
  <p>This page uploads cover_data from the database to Supabase Storage so thumbnails load fast on all devices.</p>
  <button id="startBtn" onclick="startMigration()">Start Migration</button>
  <div id="log"></div>
  <script>
    var SUPABASE_URL = 'https://oatwyxkzonhjfdzapjyb.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_BP2pN_2F9YOgC2K3yZPjIA_nDYxmGie';
    var logEl = document.getElementById('log');

    function log(msg, cls) {
      var span = document.createElement('span');
      span.className = cls || '';
      span.textContent = msg + '\n';
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function startMigration() {
      document.getElementById('startBtn').disabled = true;
      log('Fetching stories with cover_data...', 'info');

      try {
        // Fetch all stories with cover_data
        var res = await fetch(SUPABASE_URL + '/rest/v1/stories?select=id,cover_data&cover_data=not.is.null&limit=100', {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        var stories = await res.json();
        log('Found ' + stories.length + ' stories with cover_data', 'info');

        var success = 0, fail = 0, skip = 0;

        for (var i = 0; i < stories.length; i++) {
          var story = stories[i];
          var id = story.id;
          var coverData = story.cover_data;

          if (!coverData || coverData.length < 100) {
            log('SKIP ' + id + ' - cover_data too small', 'err');
            skip++;
            continue;
          }

          // Convert base64 data URL to blob
          try {
            var parts = coverData.split(',');
            var mime = parts[0].match(/:(.*?);/)[1];
            var binary = atob(parts[1]);
            var arr = new Uint8Array(binary.length);
            for (var j = 0; j < binary.length; j++) arr[j] = binary.charCodeAt(j);
            var blob = new Blob([arr], { type: mime });

            // Upload to Supabase Storage
            var filePath = encodeURIComponent(id) + '/cover';
            var uploadUrl = SUPABASE_URL + '/storage/v1/object/story-covers/' + filePath;

            var uploadRes = await fetch(uploadUrl, {
              method: 'POST',
              headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': 'Bearer ' + SUPABASE_KEY,
                'Content-Type': blob.type || 'image/jpeg'
              },
              body: blob
            });

            if (uploadRes.status === 409) {
              // Already exists, try PUT
              uploadRes = await fetch(uploadUrl, {
                method: 'PUT',
                headers: {
                  'apikey': SUPABASE_KEY,
                  'Authorization': 'Bearer ' + SUPABASE_KEY,
                  'Content-Type': blob.type || 'image/jpeg'
                },
                body: blob
              });
            }

            if (uploadRes.ok) {
              log('✅ ' + (i + 1) + '/' + stories.length + ' ' + id + ' (' + Math.round(blob.size / 1024) + 'KB)', 'ok');
              success++;
            } else {
              var errText = await uploadRes.text().catch(function() { return ''; });
              log('❌ ' + (i + 1) + '/' + stories.length + ' ' + id + ' - HTTP ' + uploadRes.status + ' ' + errText.substring(0, 100), 'err');
              fail++;
            }
          } catch (e) {
            log('❌ ' + (i + 1) + '/' + stories.length + ' ' + id + ' - ' + e.message, 'err');
            fail++;
          }

          // Small delay between uploads
          if (i < stories.length - 1) {
            await new Promise(function(r) { setTimeout(r, 200); });
          }
        }

        log('\n=== DONE ===', 'info');
        log('Success: ' + success + ' | Failed: ' + fail + ' | Skipped: ' + skip, 'info');
        log('Refresh the homepage to see covers!', 'ok');
      } catch (e) {
        log('Migration error: ' + e.message, 'err');
      }

      document.getElementById('startBtn').disabled = false;
    }
  </script>
</body>
</html>
