<!DOCTYPE html>
<html lang="vi">
<head>
  <style>html{opacity:0!important;transition:opacity .3s ease!important}</style>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090f" />
  <title>Tác Giả | AudioHub</title>
  <link rel="stylesheet" href="../css/style-categories.css?v=20260828-1" />
  <link rel="stylesheet" href="../css/channel.css?v=20260828-1" />
  <link rel="stylesheet" href="../css/channel-mobile.css?v=20260828-1" />
</head>
<body class="channel-page">
<div id="page-content">

  <div class="m-page">

  <!-- Banner -->
  <div class="ch-banner" data-channel-banner>
    <div class="ch-banner__fade"></div>
  </div>

  <!-- Channel Info -->
  <section class="ch-info">
    <div class="container">
      <div class="ch-info__inner">
        <div class="ch-info__avatar" data-channel-avatar><span data-channel-initials>AH</span></div>
        <div class="ch-info__text">
          <h1 class="ch-info__name" data-channel-name>Tác giả</h1>
          <p class="ch-info__handle" data-channel-handle></p>
          <div class="ch-info__badges">
            <span class="ch-badge ch-badge--role"><i class="fa-solid fa-headphones"></i> Tác giả Audio</span>
            <span class="ch-badge ch-badge--verified"><i class="fa-solid fa-circle-check"></i> Verified</span>
          </div>
          <div class="ch-info__stats" data-channel-stats></div>
          <p class="ch-info__bio" data-channel-bio></p>
        </div>
        <div class="ch-info__actions">
          <button type="button" class="btn btn--primary ch-sub-btn" data-subscribe-btn><i class="fa-solid fa-bell"></i> Đăng ký</button>
          <button type="button" class="btn btn--outline ch-sub-btn ch-sub-btn--active" data-subscribe-btn-subscribed style="display:none"><i class="fa-solid fa-bell"></i> Đã đăng ký</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Tabs -->
  <nav class="ch-tabs">
    <div class="container">
      <div class="ch-tabs__inner">
        <button class="ch-tab is-active" data-tab="stories"><i class="fa-solid fa-book"></i> Truyện</button>
        <button class="ch-tab" data-tab="about"><i class="fa-solid fa-circle-info"></i> Giới thiệu</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="ch-main">
    <div class="container">

      <!-- Featured -->
      <div class="ch-featured" data-featured-section>
        <span class="ch-eyebrow"><i class="fa-solid fa-star"></i> Truyện nổi bật</span>
        <div class="ch-featured__body">
          <div class="ch-featured__cover">
            <div class="ch-featured__thumb"><span data-featured-initials>AH</span></div>
          </div>
          <div class="ch-featured__info">
            <h2 class="ch-featured__title" data-featured-title>Đang tải...</h2>
            <p class="ch-featured__meta" data-featured-meta></p>
            <p class="ch-featured__desc" data-featured-desc></p>
            <span class="ch-featured__genre" data-featured-genre></span>
          </div>
        </div>
        <div class="ch-featured__actions">
          <a href="#" class="btn btn--primary ch-featured__listen"><i class="fa-solid fa-play"></i> Nghe ngay</a>
          <button type="button" class="btn btn--outline ch-featured__fav" data-featured-fav><i class="fa-regular fa-heart"></i> Yêu thích</button>
        </div>
      </div>

      <!-- Tab: Stories -->
      <div class="ch-tab-content is-active" data-tab-content="stories">
        <div class="ch-section">
          <div class="ch-section__head">
            <h2><i class="fa-solid fa-book"></i> Truyện của tác giả</h2>
          </div>
          <div class="ch-sort-bar">
            <button class="ch-sort-btn is-active" data-sort="latest">Mới nhất</button>
            <button class="ch-sort-btn" data-sort="popular">Phổ biến</button>
            <button class="ch-sort-btn" data-sort="oldest">Cũ nhất</button>
          </div>
          <div class="ch-grid" data-stories-grid></div>
        </div>
      </div>

      <!-- Tab: About -->
      <div class="ch-tab-content" data-tab-content="about" hidden>
        <div class="ch-about">
          <div class="ch-about__main">
            <div class="ch-about__header">
              <h3>Giới thiệu</h3>
              <button type="button" class="ch-about__edit-btn is-hidden" data-edit-profile-btn title="Chỉnh sửa giới thiệu"><i class="fa-solid fa-pen"></i> Sửa</button>
            </div>
            <p data-about-desc>Tác giả truyện audio trên AudioHub.</p>
            <h3>Thống kê</h3>
            <div class="ch-about__socials" data-social-links>
              <a href="#" class="ch-social-btn" data-social-facebook><i class="fa-brands fa-facebook"></i> <span>Facebook</span></a>
              <a href="#" class="ch-social-btn" data-social-youtube><i class="fa-brands fa-youtube"></i> <span>YouTube</span></a>
              <a href="#" class="ch-social-btn" data-social-website><i class="fa-solid fa-globe"></i> <span>Website</span></a>
            </div>
          </div>
          <div class="ch-about__side">
            <div class="ch-about__stat"><i class="fa-solid fa-calendar"></i><div><strong>Tham gia</strong><span data-about-joined>—</span></div></div>
            <div class="ch-about__stat"><i class="fa-solid fa-eye"></i><div><strong>Tổng lượt nghe</strong><span data-about-views>0</span></div></div>
            <div class="ch-about__stat"><i class="fa-solid fa-headphones"></i><div><strong>Truyện</strong><span data-about-audios>0</span></div></div>
          </div>
        </div>
      </div>

      <!-- Edit Profile Modal -->
      <div class="ch-edit-modal is-hidden" data-edit-profile-modal>
        <div class="ch-edit-modal__backdrop" data-edit-profile-close></div>
        <div class="ch-edit-modal__panel">
          <button type="button" class="ch-edit-modal__close" data-edit-profile-close><i class="fa-solid fa-xmark"></i></button>
          <h3><i class="fa-solid fa-pen"></i> Chỉnh sửa giới thiệu</h3>
          <label class="ch-edit-modal__field">
            <span>Giới thiệu bản thân</span>
            <textarea data-edit-profile-desc rows="3" placeholder="Giới thiệu ngắn gọn về bản thân..."></textarea>
          </label>
          <label class="ch-edit-modal__field">
            <span><i class="fa-brands fa-facebook"></i> Facebook URL</span>
            <input type="url" data-edit-profile-facebook placeholder="https://facebook.com/..." />
          </label>
          <label class="ch-edit-modal__field">
            <span><i class="fa-brands fa-youtube"></i> YouTube URL</span>
            <input type="url" data-edit-profile-youtube placeholder="https://youtube.com/..." />
          </label>
          <label class="ch-edit-modal__field">
            <span><i class="fa-solid fa-globe"></i> Website URL</span>
            <input type="url" data-edit-profile-website placeholder="https://..." />
          </label>
          <button type="button" class="ch-edit-modal__save" data-edit-profile-save><i class="fa-solid fa-check"></i> Lưu</button>
        </div>
      </div>

    </div>
  </div>

  </div> <!-- /m-page -->

</div>
    <script src="../js/api-client.js?v=20260828-1"></script>
  <script src="../js/supabase-client.js?v=20260828-1"></script>
  <script src="../js/stories-store.js?v=20260828-1"></script>
  <script src="../js/auth-state.js?v=20260828-1"></script>
<script src="../js/shell-inject.js?v=20260828-1"></script>
  <script src="../js/stories-cover-store.js?v=20260828-1" data-page-script></script>
  <script src="../js/channel-ui.js?v=20260828-1" data-page-script></script>
</body>
</html>
