<!DOCTYPE html>
<html lang="vi">
<head>
  <style>html{opacity:0!important;transition:opacity .3s ease!important}</style>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090f" />
  <title>Tác Giả | AudioHub</title>
  <link rel="stylesheet" href="../css/style-categories.css" />
  <link rel="stylesheet" href="../css/channel.css" />
</head>
<body class="channel-page">
<div id="page-content">

  <div class="m-page">

  <!-- Banner -->
  <div class="ch-banner" data-channel-banner>
    <div class="ch-banner__fade"></div>
  </div>

  <!-- Channel Info -->
  <section class="ch-info">
    <div class="container">
      <div class="ch-info__inner">
        <div class="ch-info__avatar" data-channel-avatar><span data-channel-initials>AH</span></div>
        <div class="ch-info__text">
          <h1 class="ch-info__name" data-channel-name>Tác giả</h1>
          <div class="ch-info__badges">
            <span class="ch-badge ch-badge--role"><i class="fa-solid fa-headphones"></i> Tác giả Audio</span>
            <span class="ch-badge ch-badge--verified"><i class="fa-solid fa-circle-check"></i> Verified</span>
          </div>
          <div class="ch-info__stats" data-channel-stats></div>
        </div>
        <div class="ch-info__actions">
          <button type="button" class="btn btn--primary ch-sub-btn" data-subscribe-btn><i class="fa-solid fa-bell"></i> Đăng ký</button>
          <button type="button" class="btn btn--outline ch-sub-btn ch-sub-btn--active" data-subscribe-btn-subscribed style="display:none"><i class="fa-solid fa-bell"></i> Đã đăng ký</button>
        </div>
      </div>
    </div>
  </section>

  <!-- Tabs -->
  <nav class="ch-tabs">
    <div class="container">
      <div class="ch-tabs__inner">
        <button class="ch-tab is-active" data-tab="audios"><i class="fa-solid fa-headphones"></i> Audio</button>
        <button class="ch-tab" data-tab="playlist"><i class="fa-solid fa-list"></i> Truyện</button>
        <button class="ch-tab" data-tab="about"><i class="fa-solid fa-circle-info"></i> Giới thiệu</button>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="ch-main">
    <div class="container">

      <!-- Featured -->
      <div class="ch-featured" data-featured-section>
        <div class="ch-featured__cover">
          <div class="ch-featured__thumb"><span data-featured-initials>AH</span></div>
          <div class="ch-featured__play"><i class="fa-solid fa-play"></i></div>
        </div>
        <div class="ch-featured__info">
          <span class="ch-eyebrow"><i class="fa-solid fa-fire"></i> Truyện nổi bật</span>
          <h2 class="ch-featured__title" data-featured-title>Đang tải...</h2>
          <p class="ch-featured__meta" data-featured-meta></p>
          <p class="ch-featured__desc" data-featured-desc></p>
          <div class="ch-featured__actions">
            <a href="#" class="btn btn--primary"><i class="fa-solid fa-play"></i> Nghe ngay</a>
            <button type="button" class="btn btn--outline" data-featured-fav><i class="fa-regular fa-heart"></i> Yêu thích</button>
          </div>
        </div>
      </div>

      <!-- Tab: Audios -->
      <div class="ch-tab-content is-active" data-tab-content="audios">
        <div class="ch-section">
          <div class="ch-section__head">
            <h2><i class="fa-solid fa-headphones"></i> Tất cả Audio</h2>
          </div>
          <div class="ch-sort-bar">
            <button class="ch-sort-btn is-active" data-sort="latest">Mới nhất</button>
            <button class="ch-sort-btn" data-sort="popular">Phổ biến</button>
            <button class="ch-sort-btn" data-sort="oldest">Cũ nhất</button>
          </div>
          <div class="ch-grid" data-audios-grid></div>
        </div>
      </div>

      <!-- Tab: Playlist -->
      <div class="ch-tab-content" data-tab-content="playlist" hidden>
        <div class="ch-section">
          <div class="ch-section__head">
            <h2><i class="fa-solid fa-list"></i> Playlist</h2>
          </div>
          <div class="ch-playlists-grid"></div>
        </div>
      </div>

      <!-- Tab: About -->
      <div class="ch-tab-content" data-tab-content="about" hidden>
        <div class="ch-about">
          <div class="ch-about__main">
            <h3>Giới thiệu</h3>
            <p data-about-desc>Tác giả truyện audio trên AudioHub.</p>
            <h3>Thống kê</h3>
            <div class="ch-about__socials">
              <a href="#" class="ch-social-btn"><i class="fa-brands fa-facebook"></i> Facebook</a>
              <a href="#" class="ch-social-btn"><i class="fa-brands fa-youtube"></i> YouTube</a>
              <a href="#" class="ch-social-btn"><i class="fa-solid fa-globe"></i> Website</a>
            </div>
          </div>
          <div class="ch-about__side">
            <div class="ch-about__stat"><i class="fa-solid fa-calendar"></i><div><strong>Tham gia</strong><span data-about-joined>—</span></div></div>
            <div class="ch-about__stat"><i class="fa-solid fa-eye"></i><div><strong>Tổng lượt nghe</strong><span data-about-views>0</span></div></div>
            <div class="ch-about__stat"><i class="fa-solid fa-headphones"></i><div><strong>Audio</strong><span data-about-audios>0</span></div></div>
            <div class="ch-about__stat"><i class="fa-solid fa-list"></i><div><strong>Truyện</strong><span data-about-playlists>0</span></div></div>
          </div>
        </div>
      </div>

    </div>
  </div>

  </div> <!-- /m-page -->

</div>
    <script src="../js/api-client.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/stories-store.js?v=20260803-1"></script>
  <script src="../js/auth-state.js"></script>
<script src="../js/shell-inject.js"></script>
  <script src="../js/stories-cover-store.js" data-page-script></script>
  <script src="../js/channel-ui.js" data-page-script></script>
</body>
</html>
