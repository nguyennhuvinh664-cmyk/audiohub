  <script src="../js/content-search.js"></script>
  <script>
/* Mobile Drawer */
(function(){
  var h=document.getElementById('mHamburger'),
      d=document.getElementById('mDrawer'),
      o=document.getElementById('mDrawerOverlay');
  function open(){d.classList.add('is-open');o.classList.add('is-open');document.body.style.overflow='hidden';}
  function close(){d.classList.remove('is-open');o.classList.remove('is-open');document.body.style.overflow='';}
  if(h)h.addEventListener('click',open);
  if(o)o.addEventListener('click',close);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
})();
</script>
  <script src="../js/dev-mode-config.js"></script>
  <script src="../js/dev-mode.js"></script>
  <script src="../js/spa-router.js"></script>
