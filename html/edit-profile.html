<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090f" />
  <title>Chỉnh Sửa Hồ Sơ | AudioHub</title>
  <link rel="stylesheet" href="../css/style-categories.css" />
  <link rel="stylesheet" href="../css/edit-profile.css" />
</head>
<body class="edit-profile-page">






<div id="page-content">

  <div class="m-page">
  <main class="edit-profile-main">
    <div class="container">
      <section class="edit-profile-card">
        <div class="edit-profile-head">
          <span class="edit-profile-kicker"><i class="fa-solid fa-user-pen"></i> Tài khoản</span>
          <h1>Chỉnh sửa hồ sơ</h1>
          <p>Cập nhật thông tin hiển thị cho tài khoản AudioHub của bạn.</p>
        </div>

        <form class="edit-profile-form" data-edit-profile-form>
          <section class="edit-section">
            <h2>Đổi ảnh đại diện</h2>
            <div class="edit-avatar-wrap">
              <div class="edit-avatar" data-edit-avatar>AN</div>
              <div class="edit-avatar-actions">
                <input class="edit-avatar-input" type="file" accept="image/*" data-edit-avatar-input />
                <button type="button" class="btn btn--outline" data-edit-avatar-pick><i class="fa-solid fa-camera"></i> Chọn ảnh từ máy</button>
              </div>
            </div>
          </section>

          <section class="edit-section">
            <h2>Đổi tên</h2>
            <label class="edit-field">
              <span>Họ tên mới</span>
              <input type="text" data-edit-name placeholder="Nhập họ tên" />
            </label>
          </section>

          <section class="edit-section">
            <h2>Đổi mật khẩu</h2>
            <label class="edit-field">
              <span>Mật khẩu hiện tại</span>
              <input type="password" data-edit-password-current placeholder="Nhập mật khẩu hiện tại" />
            </label>
            <label class="edit-field">
              <span>Mật khẩu mới</span>
              <input type="password" data-edit-password-next placeholder="Nhập mật khẩu mới" />
            </label>
            <label class="edit-field">
              <span>Xác nhận mật khẩu mới</span>
              <input type="password" data-edit-password-confirm placeholder="Nhập lại mật khẩu mới" />
            </label>
          </section>

          <p class="edit-profile-status is-hidden" data-edit-status></p>

          <div class="edit-profile-actions">
            <a href="account.html" class="btn btn--outline">Huỷ</a>
            <button type="submit" class="btn btn--primary" data-edit-save>Lưu thay đổi</button>
          </div>
        </form>
      </section>
    </div>
  </main>
  </div> <!-- /m-page -->


</div>
  <script src="../js/api-client.js"></script>
  <script src="../js/auth-state.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/stories-store.js"></script>
  <script src="../js/edit-profile-ui.js" data-page-script></script>
</body>
</html>
