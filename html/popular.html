<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090f" />
  <title>Truyện Phổ Biến | AudioHub</title>
  <link rel="stylesheet" href="../css/style-categories.css" />
  <link rel="stylesheet" href="../css/header-enhancements.css" />
  <link rel="stylesheet" href="../css/story-filters.css" />
  <link rel="stylesheet" href="../css/library-state.css" />
</head>
<body class="listing-page">
<div id="page-content">

  <div class="m-page">
  <main>
    <section class="stories-hero"><div class="container"><h1 class="stories-hero__title">Truyện Phổ Biến</h1></div></section>
    <section class="stories-section"><div class="container">
      <div class="story-filter-panel">
        <form class="story-filter-form" data-story-filter-form>
          <div class="story-filter-field"><label for="filter-title">Tên truyện</label><input id="filter-title" class="story-filter-input" type="search" placeholder="Tìm theo tên truyện" data-filter-title /></div>
          <div class="story-filter-field"><label for="filter-author">Tác giả</label><input id="filter-author" class="story-filter-input" type="search" placeholder="Tìm theo tác giả" data-filter-author /></div>
          <div class="story-filter-field"><label for="filter-genre">Thể loại</label><select id="filter-genre" class="story-filter-select" data-filter-genre><option value="">Tất cả thể loại</option><option value="Cổ Đại">Cổ Đại</option><option value="Cổ Tích">Cổ Tích</option><option value="Đam Mỹ">Đam Mỹ</option><option value="Dị Năng">Dị Năng</option><option value="Fanfic">Fanfic</option><option value="Hệ Thống">Hệ Thống</option><option value="Hiện Đại">Hiện Đại</option><option value="Hoàng Đế">Hoàng Đế</option><option value="Huyền Huyễn">Huyền Huyễn</option><option value="Không Gian">Không Gian</option><option value="Kiếm Hiệp">Kiếm Hiệp</option><option value="Linh Dị">Linh Dị</option><option value="Mạt Thế">Mạt Thế</option><option value="Ngôn Tình">Ngôn Tình</option><option value="Ngọt Sủng">Ngọt Sủng</option><option value="Nữ Cường">Nữ Cường</option><option value="Quân Nhân">Quân Nhân</option><option value="Sát Thủ">Sát Thủ</option><option value="Sủng Thú">Sủng Thú</option><option value="Tận Thế">Tận Thế</option><option value="Thập Niên">Thập Niên</option><option value="Thú Nhân">Thú Nhân</option><option value="Tinh Tế">Tinh Tế</option><option value="Trọng Sinh">Trọng Sinh</option></select></div>
          <div class="story-filter-actions"><button type="submit" class="btn btn--primary story-filter-btn">Áp Dụng</button><button type="button" class="btn btn--outline story-filter-reset" data-filter-reset>Xóa Lọc</button></div>
        </form>
        <div class="story-filter-summary" data-filter-summary>Hiển thị tất cả truyện trong danh sách.</div>
        <div class="story-empty" data-filter-empty>Không tìm thấy truyện phù hợp với bộ lọc hiện tại.</div>
      </div>

      <div class="stories-grid" data-story-filter-root></div>
      <nav class="pagination" aria-label="Phân trang truyện phổ biến"></nav>
    </div></section>
  </main>
  </div> <!-- /m-page -->

</div>
    <script src="../js/api-client.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/stories-store.js"></script>
  <script src="../js/auth-state.js"></script>
<script src="../js/shell-inject.js"></script>
  <script src="../js/story-filters.js" data-page-script></script>
  <script src="../js/library-state.js" data-page-script></script>
  <script src="../js/stories-cover-store.js" data-page-script></script>
  <script src="../js/stories-listing.js" data-page-script></script>
</body>
</html>
