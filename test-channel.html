<!DOCTYPE html>
<html>
<head>
  <title>Test Channel Data</title>
</head>
<body>
  <h1>Test Channel Data</h1>
  <pre id="output"></pre>
  <script>
    var output = document.getElementById('output');
    var log = function(msg) {
      output.textContent += msg + '\n';
    };

    // Check localStorage
    log('=== Checking localStorage ===');
    var stories = localStorage.getItem('audiohub-stories');
    log('audiohub-stories exists: ' + (!!stories));

    if (stories) {
      try {
        var parsed = JSON.parse(stories);
        log('Total stories: ' + parsed.length);
        log('\n=== First 3 stories ===');
        parsed.slice(0, 3).forEach(function(s, i) {
          log('\nStory ' + (i + 1) + ':');
          log('  title: ' + (s.title || 'N/A'));
          log('  author: ' + (s.author || 'N/A'));
          log('  views: ' + (s.views || 'N/A'));
          log('  date: ' + (s.date || 'N/A'));
          log('  id: ' + (s.id || 'N/A'));
        });

        // Get unique authors
        var authors = {};
        parsed.forEach(function(s) {
          if (s.author) {
            authors[s.author] = (authors[s.author] || 0) + 1;
          }
        });
        log('\n=== Authors ===');
        Object.keys(authors).forEach(function(author) {
          log(author + ': ' + authors[author] + ' stories');
        });
      } catch(e) {
        log('Error parsing: ' + e.message);
      }
    }

    // Check URL params
    log('\n=== URL Parameters ===');
    var urlParams = new URLSearchParams(window.location.search);
    var author = urlParams.get('author');
    log('author param: ' + (author || 'not set'));

    // Try filtering
    if (stories && author) {
      var parsed = JSON.parse(stories);
      var filtered = parsed.filter(function(s) {
        return s.author && s.author.toLowerCase() === author.toLowerCase();
      });
      log('\nFiltered stories for "' + author + '": ' + filtered.length);
    }
  </script>
</body>
</html>
