services:
  - type: web
    name: audiohub
    runtime: node
    buildCommand: cd backend && npm install && npx prisma generate && npx tsc -p tsconfig.json
    startCommand: cd backend && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DISABLE_PRISMA_MIGRATE
        value: "true"
